name: Head Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Head Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recreate head tag and release
        run: |
          gh release delete head --yes --cleanup-tag 2>/dev/null || true
          git tag -f head
          git push -f origin head
          gh release create head --title "Head Release" --notes "Built from latest commit on main" --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  releases-matrix:
    name: Release Rust Binary
    needs: prepare
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-latest, target: i686-unknown-linux-musl }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: i686-pc-windows-msvc }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/setup-cross-toolchain-action@v1
        if: runner.os == 'Linux'
        with:
          target: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: sqsPeek
          target: ${{ matrix.target }}
          archive: sqsPeek-$tag-$target
          tar: unix
          zip: windows
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: refs/tags/head
