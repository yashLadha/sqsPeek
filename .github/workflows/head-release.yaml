name: Head Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    uses: ./.github/workflows/ci.yaml

  prepare:
    name: Prepare Head Release
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recreate head tag and release
        run: |
          gh release delete head --yes --cleanup-tag 2>/dev/null || true
          git tag -f head
          git push -f origin head
          gh release create head --title "Head Release" --notes "Built from latest commit on main" --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  binaries:
    needs: prepare
    uses: ./.github/workflows/build-release.yaml
    with:
      ref: refs/tags/head
